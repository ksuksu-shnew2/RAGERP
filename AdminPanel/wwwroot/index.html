<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: #eee; }
        h1 { color: #e94560; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #16213e; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        tr:hover { background: #16213e; }
    </style>
</head>
<body>
    <h1>Admin Panel</h1>
    <h2>Игроки</h2>
    <table>
        <thead>
            <tr><th>ID</th><th>Логин</th><th>Баланс</th><th>Уровень</th><th>Фракция</th><th>Админ</th></tr>
        </thead>
        <tbody id="players"></tbody>
    </table>
    <script>
        fetch('/api/players')
            .then(r => r.json())
            .then(players => {
                const tbody = document.getElementById('players');
                players.forEach(p => {
                    tbody.innerHTML += `<tr>
                        <td>${p.id}</td>
                        <td>${p.login}</td>
                        <td>$${p.money}</td>
                        <td>${p.level}</td>
                        <td>${p.factionId}</td>
                        <td>${p.adminLevel}</td>
                    </tr>`;
                });
            });
    </script>
</body>
</html>
